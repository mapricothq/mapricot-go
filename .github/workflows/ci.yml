name: CI
# Tests against the live API on every push and pull request, and weekly to catch API changes.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        go: ['1.22', 'stable']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -v ./...
        env:
          MAPRICOT_KEY: ${{ secrets.MAPRICOT_KEY }}
  endpoints:
    # Fails when the API gains an endpoint that this client has no method for.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          curl -fsS https://api.mapricot.com/openapi.json | jq -r '.paths | keys[] | sub("\\{.*"; "")' | while read -r path; do
            grep -qF "$path" mapricot.go || { echo "::error::No method for $path"; exit 1; }
          done
