name: Release
# A tag such as v0.1.0 is the release. This checks the version constant and asks the Go proxy for the new version,
# so pkg.go.dev lists it right away.
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check the tag matches the version constant
        run: grep -qx "const version = \"${GITHUB_REF_NAME#v}\"" mapricot.go
      - run: curl -fsS "https://proxy.golang.org/github.com/mapricothq/mapricot-go/@v/$GITHUB_REF_NAME.info"
