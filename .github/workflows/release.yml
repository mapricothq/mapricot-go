name: Release
# Tags the version constant once it's merged to main and has no tag yet, then asks the Go proxy for the new
# version so pkg.go.dev lists it right away.
on:
  push:
    branches: [main]
concurrency: release
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: check
        run: |
          version=$(sed -n 's/^const version = "\(.*\)"$/\1/p' mapricot.go)
          test -n "$version"
          git ls-remote --exit-code --tags origin "v$version" || echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.tag
        run: gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
      - if: steps.check.outputs.tag
        run: curl -fsS "https://proxy.golang.org/github.com/mapricothq/mapricot-go/@v/$TAG.info"
        env:
          TAG: ${{ steps.check.outputs.tag }}
